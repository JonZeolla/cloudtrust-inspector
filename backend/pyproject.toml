[project]
name = "cloudtrust-inspector"
version = "0.1.0"
description = "AWS compliance management platform"
authors = [
    { name = "CloudTrust Team" }
]
dependencies = [
    "fastapi==0.109.2",
    "uvicorn==0.27.1",
    "sqlalchemy==2.0.25",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "pydantic==2.6.1",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.1",
    "requests==2.31.0",
    "boto3==1.34.34",
    "openai==1.12.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "httpx==0.26.0",
    "pytest-asyncio==0.23.5",
    "black==24.1.1",
    "ruff==0.2.1",
    "mypy==1.8.0",
    "pre-commit==3.6.0",
    "types-sqlalchemy",
    "types-requests",
    "types-python-jose",
    "types-passlib",
    "types-boto3",
    "types-jinja2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
# plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$' 